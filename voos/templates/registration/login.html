{% extends "voos/base.html" %}
{% block titulo %}Entrar · AirScan{% endblock %}
{% block conteudo %}
<article style="max-width:420px;margin:2rem auto">
  <header><strong>Entrar no AirScan</strong></header>
  {% if form.errors %}<div class="msg error">Usuário ou senha incorretos.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Usuário {{ form.username }}</label>
    <label>Senha {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" style="width:100%">Entrar</button>
  </form>
</article>
{% endblock %}

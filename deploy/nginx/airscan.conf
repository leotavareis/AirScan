# AirScan — arquivo próprio em sites-available/airscan; não altera o site do tzurapp.

server {
    listen 80;
    listen [::]:80;
    server_name airscan.tzurapp.com.br;

    # Validação do Let's Encrypt (certbot certonly --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/airscan/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --- (o instalar.sh corta daqui para baixo enquanto não há certificado)

server {
    # A porta 443 pública é do sslh, que repassa o TLS para cá. Nunca use "listen 443".
    listen 127.0.0.1:8443 ssl;
    server_name airscan.tzurapp.com.br;

    ssl_certificate /etc/letsencrypt/live/airscan.tzurapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airscan.tzurapp.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location /static/ {
        alias /var/www/airscan/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
